<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline — CryptoPay</title>
  <meta name="theme-color" content="#000000">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #09090B;
      border: 1px solid #27272A;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    .icon-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: #18181B;
      border: 1px solid rgba(250, 204, 21, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
    }
    .icon-box svg {
      width: 32px;
      height: 32px;
      color: #FACC15;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #18181B;
      border: 1px solid rgba(250, 204, 21, 0.3);
      color: #FACC15;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #FACC15;
      box-shadow: 0 0 6px #FACC15;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #A1A1AA;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      background: #3B82F6;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      transition: opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #71717A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364 9 9 0 012.828-6.364m4.243 4.243a5 5 0 01-1.414 3.536m-2.829-2.829L3 3" />
      </svg>
    </div>
    
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Network Disconnected</span>
    </div>

    <h1>You Are Currently Offline</h1>
    
    <p>
      CryptoPay requires an active Internet connection to communicate with Polygon blockchain nodes, query token balances, and broadcast transactions.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>

    <div class="hint">
      Cached payment receipts remain saved in your browser storage.
    </div>
  </div>
</body>
</html>
