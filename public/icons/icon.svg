<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="#27272A" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />
  <circle cx="280" cy="280" r="120" fill="#00E676" opacity="0.12" filter="url(#glow)" />

  <!-- Shield Boundary -->
  <path
    d="M 256 70 
       L 390 130 
       C 390 280, 256 390, 256 420 
       C 256 390, 122 280, 122 130 
       Z"
    fill="url(#shieldGrad)"
    stroke="url(#brandGrad)"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- Inner Polygon Node Network / Currency Symbol -->
  <g transform="translate(256, 245) scale(0.95)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagon Ring -->
    <path
      d="M 0 -85 L 74 -42 L 74 42 L 0 85 L -74 42 L -74 -42 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      opacity="0.9"
    />
    <!-- Nodes -->
    <circle cx="0" cy="-85" r="9" fill="#00E676" />
    <circle cx="74" cy="-42" r="9" fill="#3B82F6" />
    <circle cx="74" cy="42" r="9" fill="#FACC15" />
    <circle cx="0" cy="85" r="9" fill="#00E676" />
    <circle cx="-74" cy="42" r="9" fill="#3B82F6" />
    <circle cx="-74" cy="-42" r="9" fill="#FACC15" />

    <!-- Inner Core Symbol -->
    <path
      d="M -30 -35 L 20 -35 C 38 -35 48 -22 48 -5 C 48 12 38 25 20 25 L -30 25 Z"
      fill="none"
      stroke="#00E676"
      stroke-width="14"
    />
    <line x1="-30" y1="-45" x2="-30" y2="45" stroke="#00E676" stroke-width="14" />
  </g>
</svg>
