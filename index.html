    <script>
      (function () {
        try {
          var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _f = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _f;
            },
            set: function (fn) {
              _f = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // ignore if cannot redefine
        }
      })();
    </script>
